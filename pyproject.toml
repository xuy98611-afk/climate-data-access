[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-data-access"
version = "0.2.0"
description = "个人气候数据工作台：44项渠道目录、ERA5和点位气象获取、来源记录与核验"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10"]

[project.optional-dependencies]
gee = ["earthengine-api>=1.4,<2"]
query = ["duckdb>=1.1,<3", "pyarrow>=15"]

[project.scripts]
climate-access = "climate_access.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climate_access = ["resources/*.json", "web/*.html"]
