[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-data-access"
version = "0.1.0"
description = "区域 ERA5 逐小时数据获取、来源记录与文件核验接口"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10"]

[project.optional-dependencies]
gee = ["earthengine-api>=1.4,<2"]
query = ["duckdb>=1.1,<3", "pyarrow>=15"]

[project.scripts]
climate-access = "climate_access.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
