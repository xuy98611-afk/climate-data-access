name: 离线测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[gee,query]"
      - run: python -m unittest discover -s tests
      - name: 构建并安装发布包
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: 在仓库外核对目录与界面资源
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from climate_access.catalogue import load_catalog; from importlib.resources import files; assert len(load_catalog()['sources']) == 44; assert '气候数据工作台' in files('climate_access').joinpath('web/index.html').read_text(encoding='utf-8'); print('Installed catalogue and HTML verified')"
